services:
  asterisk:
    image: ${FRONTDESKQ_ASTERISK_IMAGE:-andrius/asterisk:22}
    container_name: frontdeskq-asterisk-local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088/tcp"
      - "10000-10020:10000-10020/udp"
    volumes:
      - ./config/ari.conf:/etc/asterisk/ari.conf:ro
      - ./config/http.conf:/etc/asterisk/http.conf:ro
      - ./config/modules.conf:/etc/asterisk/modules.conf:ro
      - ./config/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./config/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./config/websocket_client.conf:/etc/asterisk/websocket_client.conf:ro
      - ./generated/extensions.conf:/etc/asterisk/extensions.conf:ro
